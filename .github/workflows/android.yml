name: Android

# Pushes to branches don't build; start a build from the Actions tab or with
# `gh workflow run android.yml` when needed.
on:
  push:
    # Pushing a tag like v0.2.0 publishes a GitHub release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The release certificate published in README.md.
  CERT_SHA256: adcd17f7746235d578e42b909550926b8f9ac9be7b3aade1983bbcff55b03f44

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      # Keep in step with app/build.gradle.kts and gradle/libs.versions.toml.
      NDK_VERSION: 27.0.12077973
      COMPILE_SDK: '36'
      BUILD_TOOLS: 36.0.0
      # Optional release signing. Without these secrets (and in pull requests
      # from forks) only the debug APK is published.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version"
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Releases need the ANDROID_KEYSTORE_* signing secrets"
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache-jdk: true

      # Keep build environments separate; Gradle checks changed source and
      # dependency inputs within an environment. A fresh key for each run
      # saves new task outputs even when the build scripts have not changed.
      - name: Restore the Gradle build cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: android-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/android.yml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/android.yml', 'gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$COMPILE_SDK" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null

      - name: Build, lint and test
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest

      - name: Save the tested Gradle build cache
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            openpgp-api/build/reports/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: signet-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Sign release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          base64 -d <<< "$KEYSTORE_BASE64" > "$keystore"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          out=app/build/outputs/apk/release
          "$tools/zipalign" -P 16 -f 4 "$out/app-release-unsigned.apk" "$out/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$out/signet-release.apk" "$out/aligned.apk"
          certs=$("$tools/apksigner" verify --print-certs "$out/signet-release.apk")
          echo "$certs"
          # One signer, and it must be the published certificate.
          test "$(grep -c 'certificate SHA-256 digest' <<< "$certs")" = 1
          grep -qx "Signer #1 certificate SHA-256 digest: $CERT_SHA256" <<< "$certs" || {
            echo "::error::The release key's certificate does not match README.md"
            exit 1
          }

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: signet-release
          path: app/build/outputs/apk/release/signet-release.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signet-release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          apk=signet-$version.apk
          mv signet-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat > notes.md <<EOF
          Install \`$apk\` on Android 8.0 or later. Updates install over earlier
          releases; debug builds must be uninstalled first.

          Signing certificate, in the format AppVerifier accepts:

          \`\`\`
          eu.nosini.signet
          $(sed 's/../&:/g; s/:$//' <<< "${CERT_SHA256^^}")
          \`\`\`

          APK SHA-256: \`$(cut -d' ' -f1 "$apk.sha256")\`
          EOF
          prerelease=()
          if [[ $version == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$apk" "$apk.sha256" -R "$GITHUB_REPOSITORY" \
            --verify-tag --title "Signet $version" --notes-file notes.md \
            --generate-notes "${prerelease[@]}"
